name: Post Movie Grid to Facebook

on:
  schedule:
    # Times in UTC. IST = UTC + 5:30
    # 12:30 IST, 19:30 IST
    - cron: "0 7 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install sharp

      - name: Post movie grid
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node post-grid.js

      - name: Commit updated tracking file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/grid-posted.json
          git diff --staged --quiet || git commit -m "Update grid-posted.json [skip ci]"
          git push
