name: Auto Post Movie Reels

on:
  schedule:
    # 6:00 PM IST -> 12:30 UTC (once a day - adjust easily if you want more)
    - cron: "30 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Run the reel bot
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: node reel-bot.js

      - name: Save reel posting history back to repo
        run: |
          git config --global user.name "fb-movie-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add state/posted-reels.json
          git diff --staged --quiet || git commit -m "Update posted reels history"
          git push
